# AI 客服平台 · 反向代理
#
# 三个刻意配置的点：
# 1. /api/v1/chat 是 SSE 流式接口 —— 必须关 proxy_buffering，
#    否则 Nginx 会把逐字输出攒成大块再发，用户看到的是"卡半天突然全出来"。
# 2. 上传接口放开 client_max_body_size，与应用的 MAX_UPLOAD_MB(20) 对齐并留余量。
# 3. 其余请求走常规代理即可。

upstream ai_app {
    server app:8000;
}

server {
    listen 80;
    server_name _;

    # ── SSE 流式聊天 ──
    location = /api/v1/chat {
        proxy_pass http://ai_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # SSE 必须：关缓冲 + 拉长读超时（Agent 多轮工具调用可能耗时较长）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 文档上传 ──
    location ~ ^/api/v1/knowledge-bases/[0-9]+/documents$ {
        proxy_pass http://ai_app;
        # 应用限制 MAX_UPLOAD_MB=20，给 multipart 编码开销留余量
        client_max_body_size 25m;
        proxy_read_timeout 120s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── 其余全部走常规代理（含 /static、/docs、其他 API）──
    location / {
        proxy_pass http://ai_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
