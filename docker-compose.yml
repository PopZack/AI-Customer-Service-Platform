services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_cs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai_cs
      POSTGRES_PASSWORD: ai_cs_pwd
      POSTGRES_DB: ai_customer_service
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_cs -d ai_customer_service"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ai_cs_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  postgres_data:
  redis_data:
