[project]
name = "enterprise-ai-customer-service"
version = "0.1.0"
description = "企业 AI 客服平台:AI + 人工协同的企业级客服平台"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.31.0",
    "alembic>=1.19.2",
    "psycopg2-binary>=2.9.12",
    "aiosqlite>=0.22.1",
    "bcrypt>=4.2.0",
    "PyJWT>=2.9.0",
    "redis>=5.0,<6.0",
    "openai>=1.50.0",
    "sse-starlette>=2.1.0",
    # ── RAG(第 14 阶段 M1)──
    "pgvector>=0.3.6",
    "fastembed>=0.4.2",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.2",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
